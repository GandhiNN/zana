[package]
name = "zana"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = {version = "1.5.10", features = ["behavior-version-latest"] }
aws-sdk-glue = "1.69.0"
aws-sdk-s3 = "1.63.0"
aws-sdk-dynamodb = "1.53.0"
aws-sdk-rds = "1.65.0"
aws-types = "1.3.3"
aws-sdk-redshift = "1.59.0"
aws-sdk-resourceexplorer2 = "1.57.0"
aws-sdk-costexplorer = "1.61.0"
aws-sdk-docdb = "1.59.0"
aws-sdk-bedrockruntime = "1.73.0"
chrono = "0.4.38"
tabled = "0.16.0"
csv = "1.3.1"
serde = {version = "1.0.215", features = ["derive"] }
directories = "5.0.1"
tracing-subscriber = "0.3.19"
tracing = "0.1.41"
time = "0.3.37"
anyhow = "1.0.95"
serde_json = "1.0.138"
ini = "1.3.0"
tokio = { version = "1.31.0", features = ["full"] }
exitcode = "1.1.2"
clap = { version = "4.4.2", features = ["derive", "cargo"] }
configparser = "3.1.0"
aws-sdk-bedrock = "1.73.0"
inquire = "0.7.5"
sha1 = "0.10.6"
aws-sdk-ssooidc = "1.60.0"
open = "5.3.2"
aws-sdk-sso = "1.59.0"
aws-sdk-cloudfront = "1.65.0"
aws-sdk-secretsmanager = "1.63.0"

[profile.release]
strip = true        # Strip symbols from binary*
opt-level = 'z'     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
